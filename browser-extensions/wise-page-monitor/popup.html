<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>Wise 页面监控</title>
    <style>
      body {
        font: 12px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        margin: 0;
        padding: 12px;
        width: 280px;
        color: #111;
      }
      h1 {
        font-size: 13px;
        margin: 0 0 8px;
      }
      .row {
        margin: 4px 0;
        color: #444;
        word-break: break-all;
      }
      .ok {
        color: #15803d;
      }
      .warn {
        color: #b45309;
      }
      button {
        margin-top: 8px;
        width: 100%;
      }
      code {
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <h1>Wise 页面监控</h1>
    <div id="status" class="row warn">正在连接…</div>
    <div id="detail" class="row"></div>
    <button id="refresh" type="button">刷新状态</button>
    <script src="popup.js"></script>
  </body>
</html>
